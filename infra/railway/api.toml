# Bootstrap applies these settings with the Railway API.
# A new service does not read this file.

[build]
builder = "DOCKERFILE"
dockerfilePath = "infra/docker/api.Dockerfile"
watchPatterns = [
  "src/**",
  "alembic/**",
  "scripts/bootstrap/**",
  "scripts/railway/release.py",
  "scripts/railway/api-entrypoint.sh",
  "pyproject.toml",
  "uv.lock",
  "infra/docker/api.Dockerfile",
  "infra/railway/api.toml",
]

[deploy]
preDeployCommand = ["python scripts/railway/release.py"]
healthcheckPath = "/health"
healthcheckTimeout = 120
startCommand = "/app/scripts/railway/api-entrypoint.sh"
