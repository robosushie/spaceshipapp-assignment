[project]
name = "spaceship"
version = "0.1.0"
description = "Internal logistics desk for the 2025 shipping book."
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "baml-py>=0.226.3",
    "fastapi>=0.165.0",
    "langgraph>=1.2.24",
    "psycopg[binary]>=3.3.9",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "sqlglot>=30.33.0",
    "sqlmodel>=0.0.50",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "scripts", "tests"]
extend-exclude = ["src/agent/baml_client"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.14"
files = ["src", "scripts", "tests"]
exclude = ["src/agent/baml_client", "alembic"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["baml_py", "baml_py.*", "langgraph.*", "langchain_core.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["src.agent.baml_client", "src.agent.baml_client.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
