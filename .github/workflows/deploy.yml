name: deploy

on:
  workflow_dispatch:

concurrency:
  group: railway-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create Railway resources
        id: railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_WORKSPACE: ${{ secrets.RAILWAY_WORKSPACE }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: uv run --no-project python scripts/railway/bootstrap.py
      - run: npm install -g @railway/cli
      - name: Deploy API
        env:
          RAILWAY_TOKEN: ${{ steps.railway.outputs.deploy_token }}
        run: railway up --service api --project "${{ steps.railway.outputs.project_id }}" --environment production --ci
      - name: Deploy agent
        env:
          RAILWAY_TOKEN: ${{ steps.railway.outputs.deploy_token }}
        run: railway up --service agent --project "${{ steps.railway.outputs.project_id }}" --environment production --ci
      - name: Deploy web
        env:
          RAILWAY_TOKEN: ${{ steps.railway.outputs.deploy_token }}
        run: railway up --service web --project "${{ steps.railway.outputs.project_id }}" --environment production --ci
