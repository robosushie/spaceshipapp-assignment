name: ci

on:
  push:
  pull_request:

jobs:
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: "0"
      - name: Check commit messages
        env:
          COMMIT_FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$COMMIT_FROM" = "0000000000000000000000000000000000000000" ]; then
            pnpm exec commitlint --from HEAD~1 --to HEAD --verbose
          else
            pnpm exec commitlint --from "$COMMIT_FROM" --to HEAD --verbose
          fi

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: spaceship
          POSTGRES_PASSWORD: spaceship
          POSTGRES_DB: spaceship
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spaceship -d spaceship"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: uv sync --all-groups
      - run: uv run ruff check src scripts tests alembic
      - run: uv run ruff format --check src scripts tests alembic
      - run: uv run mypy
      - env:
          DATABASE_URL: postgresql+psycopg://spaceship:spaceship@localhost:5432/spaceship
          JWT_SECRET: 0123456789abcdef0123456789abcdef
          JWT_ISSUER: spaceship
          JWT_AUDIENCE: spaceship-web
          COOKIE_SECURE: "false"
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: "0"
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web test

  deploy:
    needs: [commits, api, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create Railway resources
        id: railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_WORKSPACE: ${{ secrets.RAILWAY_WORKSPACE }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: uv run --no-project python scripts/railway/bootstrap.py
      - run: npm install -g @railway/cli
      - name: Deploy API
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service api --project "${{ steps.railway.outputs.project_id }}" --environment production --ci
      - name: Deploy web
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service web --project "${{ steps.railway.outputs.project_id }}" --environment production --ci
