name: ci

on:
  push:
  pull_request:

jobs:
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: "0"
      - name: Check commit messages
        env:
          COMMIT_FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$COMMIT_FROM" ] || [ "$COMMIT_FROM" = "0000000000000000000000000000000000000000" ]; then
            pnpm exec commitlint --from HEAD~1 --to HEAD --verbose
          else
            pnpm exec commitlint --from "$COMMIT_FROM" --to HEAD --verbose
          fi

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: spaceship
          POSTGRES_PASSWORD: spaceship
          POSTGRES_DB: spaceship
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spaceship -d spaceship"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: uv sync --all-groups
      - run: uv run ruff check src scripts tests alembic
      - run: uv run ruff format --check src scripts tests alembic
      - run: uv run mypy
      - env:
          DATABASE_URL: postgresql+psycopg://spaceship:spaceship@localhost:5432/spaceship
          JWT_SECRET: 0123456789abcdef0123456789abcdef
          JWT_ISSUER: spaceship
          JWT_AUDIENCE: spaceship-web
          COOKIE_SECURE: "false"
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: "0"
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web test
