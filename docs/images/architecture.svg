<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" role="img">
  <title>Spaceship architecture</title>
  <desc>The desk calls the API. The API reads Postgres and queues questions on Redis. The agent reads the book and asks Anthropic. OpenAI and Resend are optional.</desc>
  <rect width="980" height="430" fill="#F2F0EB"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8 5 L 0 8.8" fill="none" stroke="#421D24" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-quiet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8 5 L 0 8.8" fill="none" stroke="#666666" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <path d="M212 90 H268" fill="none" stroke="#421D24" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M452 90 H508" fill="none" stroke="#421D24" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M364 132 V192" fill="none" stroke="#421D24" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M452 242 H508" fill="none" stroke="#421D24" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M692 242 H748" fill="none" stroke="#421D24" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M604 132 V192" fill="none" stroke="#421D24" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M364 48 V22 H844 V40" fill="none" stroke="#666666" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-quiet)"/>
  <path d="M276 124 V156 H20 V358 H28" fill="none" stroke="#666666" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-quiet)"/>

  <text x="228" y="82" fill="#666666" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">/v1</text>
  <text x="468" y="82" fill="#666666" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">SQL</text>
  <text x="372" y="168" fill="#666666" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">queue</text>
  <text x="468" y="234" fill="#666666" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">job</text>
  <text x="708" y="234" fill="#666666" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">BAML</text>
  <text x="612" y="168" fill="#666666" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">SELECT</text>
  <text x="560" y="16" fill="#666666" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">titles</text>
  <text x="22" y="230" fill="#666666" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">mail</text>

  <g>
    <rect x="36" y="48" width="176" height="84" rx="16" fill="#FFFFFF" stroke="#E3E3E2"/>
    <g transform="translate(54 78)" fill="none" stroke="#421D24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="1" width="22" height="16" rx="2"/>
      <path d="M1 6 H23"/>
      <path d="M9 17 v3 h6"/>
    </g>
    <text x="92" y="86" fill="#292827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Desk</text>
    <text x="92" y="106" fill="#666666" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">Vite and React</text>
  </g>

  <g>
    <rect x="276" y="48" width="176" height="84" rx="16" fill="#FFFFFF" stroke="#E3E3E2"/>
    <g transform="translate(294 78)" fill="none" stroke="#421D24" stroke-width="1.5" stroke-linecap="round">
      <rect x="2" y="1" width="20" height="7" rx="1.5"/>
      <rect x="2" y="12" width="20" height="7" rx="1.5"/>
      <circle cx="6" cy="4.5" r="0.8" fill="#421D24" stroke="none"/>
      <circle cx="6" cy="15.5" r="0.8" fill="#421D24" stroke="none"/>
    </g>
    <text x="332" y="86" fill="#292827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">API</text>
    <text x="332" y="106" fill="#666666" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">FastAPI</text>
  </g>

  <g>
    <rect x="516" y="48" width="176" height="84" rx="16" fill="#FFFFFF" stroke="#E3E3E2"/>
    <g transform="translate(534 78)" fill="none" stroke="#421D24" stroke-width="1.5">
      <ellipse cx="12" cy="5" rx="8" ry="3"/>
      <path d="M4 5 v11 c0 1.7 3.6 3 8 3 s8-1.3 8-3 V5"/>
    </g>
    <text x="572" y="86" fill="#292827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Postgres</text>
    <text x="572" y="106" fill="#666666" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">shipping book</text>
  </g>

  <g>
    <rect x="756" y="48" width="176" height="84" rx="16" fill="#FFFFFF" stroke="#E3E3E2" stroke-dasharray="4 4"/>
    <g transform="translate(774 78)" fill="none" stroke="#421D24" stroke-width="1.5" stroke-linejoin="round">
      <path d="M7 18 h11 a3.2 3.2 0 0 0 .3-6.4 4.2 4.2 0 0 0-8-1.5 A3 3 0 0 0 7 18 z"/>
    </g>
    <text x="812" y="86" fill="#292827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">OpenAI</text>
    <text x="812" y="106" fill="#666666" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">tab title, optional</text>
  </g>

  <g>
    <rect x="276" y="200" width="176" height="84" rx="16" fill="#FFFFFF" stroke="#E3E3E2"/>
    <g transform="translate(294 230)" fill="none" stroke="#421D24" stroke-width="1.5">
      <rect x="3" y="2" width="18" height="4.5" rx="1"/>
      <rect x="3" y="9" width="18" height="4.5" rx="1"/>
      <rect x="3" y="16" width="18" height="4.5" rx="1"/>
    </g>
    <text x="332" y="238" fill="#292827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Redis</text>
    <text x="332" y="258" fill="#666666" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">question queue</text>
  </g>

  <g>
    <rect x="516" y="200" width="176" height="84" rx="16" fill="#FFFFFF" stroke="#E3E3E2"/>
    <g transform="translate(534 230)" fill="none" stroke="#421D24" stroke-width="1.5" stroke-linecap="round">
      <circle cx="6" cy="7" r="2.2"/>
      <circle cx="17" cy="5" r="2.2"/>
      <circle cx="12" cy="16" r="2.2"/>
      <path d="M8 8 L15 6 M7.4 9 L10.6 14.2 M15.4 7 L13.2 14"/>
    </g>
    <text x="572" y="238" fill="#292827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Agent</text>
    <text x="572" y="258" fill="#666666" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">LangGraph, BAML</text>
  </g>

  <g>
    <rect x="756" y="200" width="176" height="84" rx="16" fill="#FFFFFF" stroke="#E3E3E2"/>
    <g transform="translate(774 230)" fill="none" stroke="#421D24" stroke-width="1.5" stroke-linejoin="round">
      <path d="M7 18 h11 a3.2 3.2 0 0 0 .3-6.4 4.2 4.2 0 0 0-8-1.5 A3 3 0 0 0 7 18 z"/>
    </g>
    <text x="812" y="238" fill="#292827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Anthropic</text>
    <text x="812" y="258" fill="#666666" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">query and reply</text>
  </g>

  <g>
    <rect x="36" y="320" width="176" height="76" rx="16" fill="#FFFFFF" stroke="#E3E3E2" stroke-dasharray="4 4"/>
    <g transform="translate(54 346)" fill="none" stroke="#421D24" stroke-width="1.5" stroke-linejoin="round">
      <rect x="1" y="4" width="22" height="14" rx="1.5"/>
      <path d="M2 5.5 L12 12 L22 5.5"/>
    </g>
    <text x="92" y="354" fill="#292827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Resend</text>
    <text x="92" y="374" fill="#666666" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">invite and reset</text>
  </g>
</svg>
